<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMA - Trekking Management Application</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-light">
    <!-- Vue 3 Mount Point -->
    <div id="app"></div>

    <!-- 1. Bootstrap 5 JS Bundle via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Vue 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>

    <!-- 3. Vue Router via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>

    <!-- 4. Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <!-- 5. TMA API Client -->
    <script src="/static/js/api.js"></script>

    <!-- 6. Vue UI Components -->
    <script src="/static/js/components/Toast.js"></script>
    <script src="/static/js/components/Navbar.js"></script>
    <script src="/static/js/components/LoginPage.js"></script>
    <script src="/static/js/components/RegisterPage.js"></script>
    <script src="/static/js/components/Placeholders.js"></script>

    <!-- Admin Suite Components -->
    <script src="/static/js/components/AdminDashboard.js"></script>
    <script src="/static/js/components/AdminTreks.js"></script>
    <script src="/static/js/components/AdminStaff.js"></script>
    <script src="/static/js/components/AdminUsers.js"></script>
    <script src="/static/js/components/AdminBookings.js"></script>
    <script src="/static/js/components/AdminSearch.js"></script>
    <script src="/static/js/components/AdminView.js"></script>

    <!-- 7. Vue Router Definition -->
    <script src="/static/js/router.js"></script>

    <!-- 8. Application Bootstrap & Mount -->
    <script src="/static/js/app.js"></script>
</body>
</html>
